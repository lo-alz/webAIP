name: Fetch airport CIFP slices

# Downloads the latest FAA CIFP on a GitHub runner (the FAA hosts are not
# reachable from every dev sandbox), slices the requested airports into
# committed fixtures (data/fixtures/<icao>_cifp.dat), and pushes them back to
# the branch — so the waypoint index and the 3D viewer cover those airports
# offline from then on.

on:
  workflow_dispatch:
    inputs:
      icaos:
        description: "Space-separated ICAO idents to slice"
        required: true
        default: "KJFK KEWR"

permissions:
  contents: write

concurrency:
  group: fetch-airports
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core deps
        run: pip install "pydantic>=2.6,<3" "lxml>=5.0"

      - name: Fetch + slice
        run: python scripts/fetch_airport_cifp.py --download ${{ inputs.icaos }}

      - name: Commit fixtures
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures/*_cifp.dat
          if git diff --cached --quiet; then
            echo "no fixture changes"
          else
            git commit -m "Airport CIFP slices: ${{ inputs.icaos }} (fetched by CI)"
            git push
          fi
