name: Deploy dashboard + viewer to GitHub Pages

# Publishes a combined static site (case-sensitive URL!):
#   dashboard/          -> https://lo-alz.github.io/webAIP/         (checklist + pipeline)
#   visualization/cesium -> https://lo-alz.github.io/webAIP/viewer/ (3D procedure viewer)
# index.html + tasks.json/countries.json are served together so the live fetch works.

on:
  push:
    branches: [claude/read-markdown-xez32t]
    paths:
      - "dashboard/**"
      - "visualization/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site (dashboard at root, viewer at /viewer/)
        run: |
          mkdir -p _site/viewer
          cp -r dashboard/.            _site/
          cp -r visualization/cesium/. _site/viewer/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
