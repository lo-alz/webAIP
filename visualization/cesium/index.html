<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AeroAIP — 3D Procedure Viewer</title>

  <!-- CesiumJS from CDN (pinned). No build step, no npm. -->
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Widgets/widgets.css" />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.130/Build/Cesium/Cesium.js"></script>

  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #hud {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      font: 13px/1.4 system-ui, sans-serif; color: #e8f1ff;
      background: rgba(10, 22, 40, 0.78); padding: 10px 14px; border-radius: 8px;
      border: 1px solid rgba(120, 170, 255, 0.35); max-width: 320px;
    }
    #hud h1 { margin: 0 0 4px; font-size: 15px; color: #7fd0ff; }
    #hud .mode { font-size: 11px; opacity: 0.8; }
    #hud .err { color: #ff8a8a; }
    #picker {
      position: absolute; top: 10px; right: 10px; z-index: 10; display: none;
      font: 13px/1.4 system-ui, sans-serif; color: #e8f1ff;
      background: rgba(10, 22, 40, 0.78); padding: 10px 14px; border-radius: 8px;
      border: 1px solid rgba(120, 170, 255, 0.35);
    }
    #picker label { display: block; font-size: 11px; opacity: 0.8; margin: 6px 0 2px; }
    #picker select { width: 220px; max-width: 60vw; padding: 3px; }
    #picker a.kml {
      display: inline-block; margin-top: 10px; padding: 5px 10px; border-radius: 6px;
      background: #ffd166; color: #1a2740; text-decoration: none; font-weight: 600;
    }
    #picker a.kml[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="hud"><h1>AeroAIP</h1><div class="mode">loading…</div></div>
  <div id="picker">
    <label for="airportSel">Airport (ICAO)</label>
    <select id="airportSel"></select>
    <label for="procSel">Procedure</label>
    <select id="procSel"></select>
    <a id="kmlLink" class="kml" href="#" aria-disabled="true">⤓ Download KML</a>
  </div>

  <script>
  "use strict";

  // ── Optional credentials (all OFF by default — the MVP needs none) ──────────
  // 1) Cesium Ion (Bing imagery + world terrain). Without it we use OpenStreetMap.
  //    Cesium.Ion.defaultAccessToken = 'YOUR_CESIUM_ION_TOKEN';
  //
  // 2) Google Photorealistic 3D Tiles — the modern "Google Earth look".
  //    CesiumJS ingests Google's tiles directly, so adopting Cesium does NOT
  //    forfeit Google's photorealistic imagery. To enable, get a Google Maps
  //    Platform key and uncomment in initViewer():
  //      const g = await Cesium.createGooglePhotorealistic3DTileset({ key: 'YOUR_GOOGLE_MAPS_KEY' });
  //      viewer.scene.primitives.add(g);
  // ────────────────────────────────────────────────────────────────────────────

  const params = new URLSearchParams(location.search);
  const pid = params.get("pid");                 // live mode when present
  const apiBase = (params.get("api") || "").replace(/\/$/, ""); // default: same origin
  const hud = document.querySelector("#hud");

  function setHud(html, mode) {
    hud.innerHTML = `<h1>AeroAIP</h1>${html}` + (mode ? `<div class="mode">${mode}</div>` : "");
  }

  const ALT_SYMBOL = { AT_OR_ABOVE: "≥", AT_OR_BELOW: "≤", AT: "=", BETWEEN: "↕" };
  const M_TO_FT = 1 / 0.3048;

  async function initViewer() {
    // Tokenless OpenStreetMap base layer + ellipsoid terrain → no credentials.
    const viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayer: Cesium.ImageryLayer.fromProviderAsync(
        Promise.resolve(new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" }))
      ),
      baseLayerPicker: false, geocoder: false, homeButton: false,
      navigationHelpButton: false, animation: false, timeline: false,
      sceneModePicker: true, infoBox: true, selectionIndicator: true,
    });
    viewer.scene.globe.enableLighting = true;
    return viewer;
  }

  async function getJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`GET ${url} → ${r.status}`);
    return r.json();
  }

  function altLabel(props) {
    if (props.alt_lower_ft == null) return "";
    const sym = ALT_SYMBOL[props.alt_type] || "";
    return `${sym}${props.alt_lower_ft.toLocaleString()} ft`;
  }

  function render(viewer, geojson) {
    viewer.entities.removeAll();   // swap cleanly when a new procedure is picked
    const points = geojson.features.filter(f => f.geometry.type === "Point");
    const route = geojson.features.find(f => f.geometry.type === "LineString");

    // Each waypoint: a point at altitude, a label, and a thin drop line to ground
    // so the height reads clearly against the terrain below.
    for (const f of points) {
      const [lon, lat, altM] = f.geometry.coordinates;
      const p = f.properties || {};
      const top = Cesium.Cartesian3.fromDegrees(lon, lat, altM);
      const ground = Cesium.Cartesian3.fromDegrees(lon, lat, 0);

      viewer.entities.add({
        position: top,
        point: { pixelSize: 9, color: Cesium.Color.CYAN,
                 outlineColor: Cesium.Color.BLACK, outlineWidth: 2,
                 disableDepthTestDistance: Number.POSITIVE_INFINITY },
        label: {
          text: `${p.waypoint_id || "?"}${altLabel(p) ? "  " + altLabel(p) : ""}`,
          font: "13px sans-serif", fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK, outlineWidth: 3,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          pixelOffset: new Cesium.Cartesian2(0, -14),
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
        },
        polyline: {
          positions: [ground, top], width: 1,
          material: Cesium.Color.CYAN.withAlpha(0.35),
        },
        description:
          `<b>${p.waypoint_id || ""}</b><br/>leg ${p.sequence_number} · ${p.path_terminator || ""}` +
          `<br/>segment ${p.segment || ""}<br/>altitude ${altLabel(p) || "—"}`,
      });
    }

    // The route itself: a polyline that climbs through the per-vertex heights,
    // plus a translucent "wall" dropped to the ground for the vertical profile.
    if (route) {
      const positions = route.geometry.coordinates.map(
        ([lon, lat, altM]) => Cesium.Cartesian3.fromDegrees(lon, lat, altM));
      viewer.entities.add({
        polyline: { positions, width: 3, clampToGround: false,
          material: new Cesium.PolylineGlowMaterialProperty({
            glowPower: 0.2, color: Cesium.Color.fromCssColorString("#ffd166") }) },
      });
      viewer.entities.add({
        wall: { positions,
          minimumHeights: positions.map(() => 0),
          material: Cesium.Color.fromCssColorString("#ffd166").withAlpha(0.12),
          outline: true, outlineColor: Cesium.Color.fromCssColorString("#ffd166").withAlpha(0.3) },
      });
    }
  }

  // ── live picker, backed by /airports + /procedures ──────────────────────────
  const airportSel = document.querySelector("#airportSel");
  const procSel = document.querySelector("#procSel");
  const kmlLink = document.querySelector("#kmlLink");

  async function loadProcedure(viewer, id, label) {
    const geojson = await getJSON(`${apiBase}/procedures/${encodeURIComponent(id)}/geojson`);
    render(viewer, geojson);
    kmlLink.href = `${apiBase}/procedures/${encodeURIComponent(id)}/kml`;
    kmlLink.setAttribute("aria-disabled", "false");
    setHud(`<div>${label || `procedure ${id}`}</div>`, `live · procedure ${id}`);
    await viewer.flyTo(viewer.entities, { duration: 1.5 });
  }

  async function populateProcedures(viewer, icao, preferId) {
    const procs = await getJSON(`${apiBase}/procedures?airport=${encodeURIComponent(icao)}`);
    procSel.innerHTML = "";
    for (const p of procs) {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = `${p.record_type} · ${p.procedure_name}`;
      opt.dataset.label = `${p.airport_icao} ${p.procedure_name}`;
      procSel.appendChild(opt);
    }
    if (!procs.length) { setHud(`<div>${icao}</div>`, "no procedures for this airport"); return; }
    const target = procs.find(p => String(p.id) === String(preferId)) || procs[0];
    procSel.value = target.id;
    await loadProcedure(viewer, target.id, `${target.airport_icao} ${target.procedure_name}`);
  }

  async function startLive(viewer, airports) {
    const icaos = [...new Set(airports.map(a => a.airport_icao))].sort();
    airportSel.innerHTML = "";
    for (const icao of icaos) {
      const opt = document.createElement("option");
      opt.value = icao; opt.textContent = icao;
      airportSel.appendChild(opt);
    }
    document.querySelector("#picker").style.display = "block";

    // Deep-link: if ?pid= was given, start on that airport/procedure.
    let startIcao = icaos[0];
    if (pid) {
      try {
        const detail = await getJSON(`${apiBase}/procedures/${encodeURIComponent(pid)}`);
        if (detail.procedure?.airport_icao) startIcao = detail.procedure.airport_icao;
      } catch { /* fall back to first airport */ }
    }
    airportSel.value = startIcao;

    airportSel.addEventListener("change", () => populateProcedures(viewer, airportSel.value).catch(showError));
    procSel.addEventListener("change", () => {
      const opt = procSel.selectedOptions[0];
      loadProcedure(viewer, procSel.value, opt?.dataset.label).catch(showError);
    });

    await populateProcedures(viewer, startIcao, pid);
  }

  async function startSample(viewer) {
    document.querySelector("#picker").style.display = "none";
    const geojson = await getJSON("sample_klax_dotss2.geojson");
    render(viewer, geojson);
    setHud(`<div>KLAX DOTSS2</div>`, "bundled sample · no backend");
    await viewer.flyTo(viewer.entities, { duration: 2.0 });
  }

  function showError(e) {
    setHud(`<div class="err">Failed to load: ${e.message}</div>`,
           "is the API running and CORS-enabled?");
    console.error(e);
  }

  (async () => {
    const viewer = await initViewer();
    try {
      // Live mode if the read API answers; otherwise the zero-backend sample.
      const airports = await getJSON(`${apiBase}/airports`);
      await startLive(viewer, airports);
    } catch (e) {
      console.warn("API unreachable — falling back to bundled sample:", e.message);
      try { await startSample(viewer); } catch (e2) { showError(e2); }
    }
  })();
  </script>
</body>
</html>
